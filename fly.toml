# fly.toml app configuration file generated for mbti-bsky on 2026-07-29T18:25:11+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mbti-bsky'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]
[deploy]
  release_command = "/bin/sh -lc 'DATABASE_URL=$DIRECT_DATABASE_URL /app/bin/migrate'"

[env]
  PHX_HOST = 'mbti.blue'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000
